name: Build & Publish ABI Split APKs

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v1.0.1

permissions:
  contents: write # REQUIRED: Gives GitHub permission to create a Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Install Flutter Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 5: Build ABI Split APKs
      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      # Step 6: Publish All Generated APKs to GitHub Releases
      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The asterisk (*) matches all ABI outputs (arm64-v8a, armeabi-v7a, x86_64)
          files: build/app/outputs/flutter-apk/app-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}